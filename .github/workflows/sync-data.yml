name: Sync DOTA 2 data

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dota2-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch official and historical data
        run: pnpm run data:sync

      - name: Validate generated data
        run: pnpm run data:validate

      - name: Commit updated snapshots
        shell: bash
        run: |
          if git diff --quiet -- \
            data/heroes.json \
            data/items.json \
            data/patches.json \
            data/patch-index.json \
            data/cn-news.json \
            data/legacy.json; then
            git restore data/meta.json data/validation-report.json
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "chore(data): sync DOTA 2 updates"
          git push
